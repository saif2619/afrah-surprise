<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJd08BODqbCw3lv0Gfr4RlzuZLAvlHHFFaK57ozaypOkXWSXtPchEFtHsRHAM3Jq6E/exec";

function saveAnswer(question, answer) {
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      question: question,
      answer: answer
    })
  }).catch(function(error) {
    console.error("Saving failed:", error);
  });
}

var QS = [
  "Can I ask you something a little special? 🌸",
  "Would you mind if I stole a little more of your time every day? 🥹",
  "Would you let me become someone who makes your days a little happier? ❤️",
  "If I looked into your eyes right now, would you be able to look away, or would you smile at me too? 🤭",
  "If I asked for one date with you, would you let me make it the most beautiful evening of your life? 🌹",
  "If I wanted to be the one who gets to call you my girl, would you let me? 🥺"
];

var REPLY = {
  yes: [
    "Yay 🥰",
    "That made me smile 🌸",
    "I hoped you'd say that 🥹",
    "You're making my heart race 🤭",
    "Best answer 🌹",
    "I'm so happy 🥺"
  ],
  no: [
    "That's okay 🌸 I'll still ask the next one",
    "Fair enough 😄 one more",
    "I'll try again 🥹",
    "Hmm… let me keep going 🤭",
    "That's okay, I'm patient 🌹",
    "Alright 🥺"
  ],
  say: "Thank you for telling me 🌸"
};

var $ = function(id) {
  return document.getElementById(id);
};

function show(id) {
  document.querySelectorAll(".screen").forEach(function(s) {
    s.classList.remove("on");
  });
  $(id).classList.add("on");
}

var cur = 0;
var dots = $("dots");

for (var d = 0; d < 7; d++) {
  dots.appendChild(document.createElement("i"));
}

function render() {
  for (var d = 0; d < 7; d++) {
    dots.children[d].classList.toggle("f", d <= cur);
  }

  $("qt").textContent = QS[cur];
  $("toast").textContent = "";
  $("qb").style.display = "flex";
  $("qsay").classList.remove("on");
  $("qin").value = "";

  Array.from($("qb").children).forEach(function(b) {
    b.disabled = false;
  });

  $("qsend").disabled = false;
}

function advance(msg) {
  $("toast").textContent = msg;

  Array.from($("qb").children).forEach(function(b) {
    b.disabled = true;
  });

  $("qsend").disabled = true;

  setTimeout(function() {
    cur++;

    if (cur < QS.length) {
      render();
    } else {
      dots.children[6].classList.add("f");
      show("final");
    }
  }, 1300);
}

// Start
$("start").onclick = function() {
  show("ask");
  render();
};

// Question Yes
$("qy").onclick = function() {
  saveAnswer(QS[cur], "Yes");
  advance(REPLY.yes[cur]);
};

// Question No
$("qn").onclick = function() {
  saveAnswer(QS[cur], "No");
  advance(REPLY.no[cur]);
};

// Type your own answer
$("qtype").onclick = function() {
  $("qb").style.display = "none";
  $("qsay").classList.add("on");
  $("qin").focus();
};

// Send typed answer
$("qsend").onclick = function() {
  var answer = $("qin").value.trim();

  if (!answer) return;

  saveAnswer(QS[cur], answer);
  $("qsay").classList.remove("on");
  advance(REPLY.say);
};

$("qin").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    $("qsend").click();
  }
});

// Final proposal
var yes = $("yes");
var no = $("no");
var face = $("face");

yes.onclick = function() {
  saveAnswer("Afrah, will you be my girlfriend?", "Yes ❤️");

  no.style.display = "none";
  show("done");
  burst();

  setTimeout(burst, 900);
};

// No button dodge
var noMoves = 0;

var noLabels = [
  "No",
  "Are you sure? 🥺",
  "Really? 😭",
  "Think again 💗",
  "Please? 🥹",
  "Wait! 💌"
];

function dodgeFinalNo(e) {
  if (e) e.preventDefault();

  noMoves++;

  no.textContent = noLabels[Math.min(noMoves, noLabels.length - 1)];
  no.style.position = "fixed";
  no.style.zIndex = "10";

  var margin = 16;
  var maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
  var maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);

  no.style.left = (margin + Math.random() * (maxX - margin)) + "px";
  no.style.top = (margin + Math.random() * (maxY - margin)) + "px";
}

no.addEventListener("pointerenter", dodgeFinalNo);
no.addEventListener("pointerdown", dodgeFinalNo);

no.onclick = function() {
  saveAnswer("Afrah, will you be my girlfriend?", "No");
  show("finalNo");
};

// Celebration animation
var cv = $("fx");
var cx = cv.getContext("2d");
var ps = [];

function size() {
  cv.width = innerWidth;
  cv.height = innerHeight;
}

size();
addEventListener("resize", size);

function burst() {
  for (var i = 0; i < 140; i++) {
    ps.push({
      x: innerWidth / 2,
      y: innerHeight * 0.55,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 16 - 4,
      r: 16 + Math.random() * 18,
      c: ["♥", "❤", "💖", "✨"][i % 4],
      life: 140 + Math.random() * 60
    });
  }
  tick();
}

function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);

  ps.forEach(function(p) {
    p.vy += 0.28;
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    cx.globalAlpha = Math.max(p.life / 60, 0);
    cx.font = p.r + "px serif";
    cx.fillText(p.c, p.x, p.y);
  });

  ps = ps.filter(function(p) {
    return p.life > 0 && p.y < cv.height + 40;
  });

  if (ps.length) {
    requestAnimationFrame(tick);
  } else {
    cx.clearRect(0, 0, cv.width, cv.height);
  }
}
</script>
